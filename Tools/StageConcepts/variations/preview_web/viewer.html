<!doctype html>
<html><head><meta charset="utf-8"><title>Room preview</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const params = new URLSearchParams(location.search);
const scenePath = params.get('scene');
const W = +(params.get('w') || 1600), H = +(params.get('h') || 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const loader = new GLTFLoader();
const texLoader = new THREE.TextureLoader();
const texCache = {};
function tex(url, srgb) {
  const key = url + srgb;
  if (!texCache[key]) {
    const t = texLoader.load(url);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    texCache[key] = t;
  }
  return texCache[key];
}
function matFrom(def, textures) {
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setRGB(def.color[0], def.color[1], def.color[2], THREE.LinearSRGBColorSpace),
    metalness: def.metallic, roughness: Math.min(1, Math.max(0.04, def.roughness)),
    side: def.doubleSided ? THREE.DoubleSide : THREE.FrontSide,
  });
  if (def.texture && textures[def.texture]) {
    const t = textures[def.texture];
    const base = tex(t.base, true).clone(); base.needsUpdate = true; base.repeat.set(def.tiling, def.tiling);
    const normal = tex(t.normal, false).clone(); normal.needsUpdate = true; normal.repeat.set(def.tiling, def.tiling);
    m.map = base; m.normalMap = normal; m.normalScale = new THREE.Vector2(def.bump, def.bump);
    if (def.emissionMap && t.emission) { const e = tex(t.emission, true).clone(); e.needsUpdate = true; e.repeat.set(def.tiling, def.tiling); m.emissiveMap = e; }
  }
  if (def.emission) { m.emissive = new THREE.Color().setRGB(def.emission[0], def.emission[1], def.emission[2], THREE.LinearSRGBColorSpace); m.emissiveIntensity = 1; }
  return m;
}
const VignetteShader = {
  uniforms: { tDiffuse: { value: null }, intensity: { value: 0.18 }, smoothness: { value: 0.45 }, contrast: { value: 1.06 }, saturation: { value: 1.07 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float intensity, smoothness, contrast, saturation; varying vec2 vUv;
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec3 col = c.rgb;
      float l = dot(col, vec3(0.2126,0.7152,0.0722)); col = mix(vec3(l), col, saturation);
      col = (col - 0.18) * contrast + 0.18; col = max(col, 0.0);
      vec2 d = (vUv - 0.5) * vec2(1.6, 1.0); float v = 1.0 - smoothstep(0.35, 0.35 + smoothness * 1.4, length(d)) * intensity * 1.6;
      gl_FragColor = vec4(col * v, c.a); }`
};
async function run() {
  const data = await (await fetch(scenePath)).json();
  const env = data.environment;
  const scene = new THREE.Scene();
  const fog = new THREE.Color().setRGB(env.fog[0], env.fog[1], env.fog[2], THREE.LinearSRGBColorSpace);
  scene.background = fog; scene.fog = new THREE.FogExp2(fog, env.fogDensity);
  scene.add(new THREE.AmbientLight(new THREE.Color().setRGB(env.ambient[0], env.ambient[1], env.ambient[2], THREE.LinearSRGBColorSpace), Math.PI));
  for (const d of env.directional) {
    const light = new THREE.DirectionalLight(new THREE.Color().setRGB(d.color[0], d.color[1], d.color[2], THREE.LinearSRGBColorSpace), d.intensity * Math.PI);
    const target = new THREE.Vector3(...d.target);
    light.position.copy(target).addScaledVector(new THREE.Vector3(...d.forward), -60);
    light.target.position.copy(target); scene.add(light.target);
    if (d.shadows) {
      light.castShadow = true; light.shadow.mapSize.set(4096, 4096); light.shadow.bias = -0.0004; light.shadow.normalBias = 0.03;
      const c = light.shadow.camera; c.left = -48; c.right = 48; c.top = 48; c.bottom = -48; c.near = 1; c.far = 160;
      if ('intensity' in light.shadow) light.shadow.intensity = d.shadowStrength;
    }
    scene.add(light);
  }
  for (const p of data.lights) {
    const l = new THREE.PointLight(new THREE.Color().setRGB(p.color[0], p.color[1], p.color[2], THREE.LinearSRGBColorSpace), p.intensity * Math.PI, p.range, 2);
    l.position.set(...p.position); scene.add(l);
  }
  const materials = {};
  for (const def of data.materials) materials[def.name] = matFrom(def, data.textures);
  const pending = [];
  for (const room of data.rooms) {
    pending.push(loader.loadAsync(room.decor).then(g => {
      g.scene.traverse(o => { if (o.isMesh) { const name = o.material.name; o.material = materials[name] || o.material;
        o.castShadow = !(materials[name] && materials[name].emissive && materials[name].emissive.r + materials[name].emissive.g + materials[name].emissive.b > 0.001); o.receiveShadow = true; } });
      const holder = new THREE.Group(); holder.matrixAutoUpdate = false; holder.matrix.fromArray(room.matrix); holder.add(g.scene); scene.add(holder);
    }));
    for (const m of room.models) {
      pending.push(loader.loadAsync(m.url).then(g => {
        g.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        const holder = new THREE.Group(); holder.matrixAutoUpdate = false; holder.matrix.fromArray(m.matrix); holder.add(g.scene); scene.add(holder);
      }));
    }
    for (const b of room.debugBoxes || []) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...b.size), new THREE.MeshBasicMaterial({ color: b.color, wireframe: true }));
      mesh.matrixAutoUpdate = false; mesh.matrix.fromArray(b.matrix); scene.add(mesh);
    }
  }
  await Promise.all(pending);
  for (const t of Object.values(texCache)) if (!t.image) await new Promise(r => setTimeout(r, 50));
  await new Promise(r => setTimeout(r, 300));
  const results = [];
  for (const cam of data.cameras) {
    const camera = new THREE.PerspectiveCamera(cam.fov, W / H, 0.1, 400);
    camera.position.set(...cam.position); camera.up.set(...cam.up); camera.lookAt(...cam.target); camera.updateMatrixWorld();
    renderer.toneMappingExposure = env.exposure;
    const composer = new EffectComposer(renderer);
    composer.setSize(W, H);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), env.bloom, 0.55, 1.0));
    composer.addPass(new OutputPass());

    composer.render();
    results.push({ name: cam.name, png: renderer.domElement.toDataURL('image/png') });
  }
  window.__results = results;
  window.__done = true;
}
run().catch(e => { window.__error = String(e && e.stack || e); window.__done = true; });
</script></body></html>
